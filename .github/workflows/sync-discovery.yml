# This workflow will review the current status of the APIs. It will verify if the API is:
#  - Reachable, i.e. we can download it.
#  - Following OpenapiV3+

name: Sync discovery

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.GH_BOT_TOKEN }}
    - name: Import GPG key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
        git config user.name "${{ secrets.BOT_NAME }}"
        git config user.email "${{ secrets.BOT_EMAIL }}"
        git config commit.gpgsign true
        git config tag.gpgsign true
        git config user.signingkey $(gpg --list-secret-keys --with-colons "${{ secrets.BOT_EMAIL }}" | awk -F: '/^sec:/ {print $5; exit}')
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - id: discovery
      run: npm run discovery
    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GH_BOT_TOKEN }}
        sign-commits: true
        title: Syncing API
        body: |
          There were some changes in the discovery or the contents of the APIs.

          Automated changes by [create-pull-request](https://github.com/peter-evans/create-pull-request) GitHub action
        commit-message: Syncing API
        delete-branch: true
        author: "${{ secrets.BOT_NAME }} <${{ secrets.BOT_EMAIL }}>"
    - name: Auto-merge PR
      if: steps.cpr.outputs.pull-request-number != ''
      run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --squash
      env:
        GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
