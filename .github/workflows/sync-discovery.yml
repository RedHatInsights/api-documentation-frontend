# This workflow will review the current status of the APIs. It will verify if the API is:
#  - Reachable, i.e. we can download it.
#  - Following OpenapiV3+

name: Sync discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        token: ${{ secrets.GH_BOT_TOKEN }}
    - name: Import GPG key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
        git config user.name "${{ secrets.BOT_NAME }}"
        git config user.email "${{ secrets.BOT_EMAIL }}"
        git config commit.gpgsign true
        git config tag.gpgsign true
        git config user.signingkey $(gpg --list-secret-keys --with-colons "${{ secrets.BOT_EMAIL }}" | awk -F: '/^sec:/ {print $5; exit}')
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - id: discovery
      run: npm run discovery
    - name: Create sync PR
      env:
        GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      run: |
        if git diff --quiet; then
          echo "No changes detected. Skipping."
          exit 0
        fi

        BRANCH="sync-discovery/patch"

        git add packages/common/config/
        git commit -m "Syncing API discovery"
        git push --force origin "HEAD:refs/heads/$BRANCH"

        EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
        if [ -z "$EXISTING_PR" ]; then
          gh pr create \
            --head "$BRANCH" \
            --title "Syncing API discovery" \
            --body "Automated sync of API discovery data."
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
        fi

        gh pr merge "$EXISTING_PR" --auto --squash --delete-branch
